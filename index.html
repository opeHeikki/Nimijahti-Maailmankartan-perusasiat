<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nimijahti Maailmankartan perusasiat</title>
  <style>
    :root{--green:#58cc02;--dark-green:#46a302;--blue:#1cb0f6;--gray:#e5e5e5;--border:#bce0fd;--wrong:#ff4b4b;--btn-width:180px}
    *{box-sizing:border-box;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
    html,body{height:100%;overflow:hidden}
    body{font-family:'din-round',system-ui,-apple-system,sans-serif;background:#f7f7f7;margin:0;padding:10px;display:flex;justify-content:center;align-items:center;color:#3c3c3c;touch-action:manipulation}
    #game-container{width:100%;max-width:900px;height:100%;max-height:700px;padding:12px;background:white;border-radius:16px;box-shadow:0 6px 20px #00000014;display:flex;flex-direction:column}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--gray);flex-shrink:0;gap:8px}
    h1{font-size:20px;margin:0;color:var(--dark-green);font-weight:800}.stats{display:flex;gap:16px;font-weight:700;font-size:17px;white-space:nowrap}#timer{color:var(--blue)}#score{color:var(--green)}
    #game-board{display:flex;gap:12px;flex:1;min-height:0;align-items:stretch}.image-container{flex:1;height:100%;display:flex;align-items:center;justify-content:center;background:#fafafa;border:2px solid var(--gray);border-radius:12px;overflow:hidden;padding:6px}
    #plant-image{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:6px;opacity:0;transition:opacity 1s ease-in-out}#plant-image.visible{opacity:1}
    .names-container{width:var(--btn-width);height:50%;display:flex;flex-direction:column;gap:4px}.name-btn{width:100%;flex:1;min-height:0;background:linear-gradient(to right,#b3d9ff,#f0f7ff);border:1px solid var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:15px;white-space:nowrap;cursor:pointer;padding:0 8px;opacity:0;visibility:hidden;pointer-events:none;transition:background .2s,border-color .2s,opacity .4s;box-shadow:0 1px 2px #00000008}.name-btn.visible{opacity:1;visibility:visible;pointer-events:auto}.name-btn:active{transform:translateY(1px)}.name-btn.wrong-flash{background:#ffdfe0!important;border-color:var(--wrong)!important;color:#d32f2f}.name-btn.correct-reveal{background:var(--green)!important;border-color:var(--dark-green)!important;color:white!important}
    @media(max-width:768px){#game-board{flex-direction:column;gap:8px}.image-container{flex:1;width:100%;height:50%}.names-container{width:100%;flex:1;height:50%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:4px}.name-btn{width:100%;height:100%;white-space:normal;line-height:1.15;font-size:26px;padding:2px 4px}h1{font-size:16px}.stats{font-size:14px;gap:8px}}
    #game-over{display:none;flex-direction:column;align-items:center;justify-content:flex-start;flex:1;gap:12px;text-align:center;padding-top:10px;overflow-y:auto}#result-message{font-size:19px;font-weight:800;color:var(--dark-green);margin:0;padding:0 5px}.score-history-title{font-size:16px;font-weight:700;margin:6px 0 4px;color:#555}#score-list{list-style:none;padding:0;margin:0;width:100%;max-width:400px;max-height:220px;overflow-y:auto;border:2px solid var(--gray);border-radius:10px;background:#fafafa}#score-list li{padding:8px 12px;font-size:15px;font-weight:700;border-bottom:1px solid var(--gray);display:flex;justify-content:space-between}#score-list li:last-child{border-bottom:0}#score-list li.latest-score{color:var(--green);font-weight:900;background:#f0fdf0}#restart-btn{background:var(--green);color:white;border:0;border-bottom:4px solid var(--dark-green);padding:12px 28px;border-radius:14px;font-size:19px;font-weight:800;cursor:pointer;text-transform:uppercase;letter-spacing:.8px;margin-top:auto;margin-bottom:10px}#restart-btn:disabled{opacity:.5;pointer-events:none}
    @keyframes varivilkutus{0%{background:#ff4b4b}20%{background:#58cc02}40%{background:#1cb0f6}60%{background:#ffc800}80%{background:#ce82ff}100%{background:#ff4b4b}}body.flashing{animation:varivilkutus 3.5s linear infinite}body.flashing #game-container{background:transparent;box-shadow:none}
  </style>
</head>
<body>
<div id="game-container">
  <header><h1>Nimijahti Maailmankartan perusasiat</h1><div class="stats"><div id="score">Pisteet: <span id="points">0</span></div><div id="timer">Aika: <span id="time-left">30</span>s</div></div></header>
  <div id="game-board"><div class="image-container"><img id="plant-image" src="" alt="Karttakohde"></div><div class="names-container"><button class="name-btn" id="btn-0"></button><button class="name-btn" id="btn-1"></button><button class="name-btn" id="btn-2"></button><button class="name-btn" id="btn-3"></button><button class="name-btn" id="btn-4"></button><button class="name-btn" id="btn-5"></button></div></div>
  <div id="game-over"><h2 id="result-message"></h2><div class="score-history-title">Pistetaulukko (Top 20)</div><ul id="score-list"></ul><button id="restart-btn" onclick="aloitaPeli()">Pelaa uudelleen</button></div>
</div>
<script>
  const nimet = [
    "Väli-Amerikka","Keski-Amerikka","Länsi-Intian saaristo","Anglo-Amerikka","Latinalainen Amerikka",
    "Eteläinen jäämeri","Pohjoinen jäämeri","Amerikka (manner)","Euraasia (manner)","Luode NW",
    "Lounas SW","Kaakko SE","Koillinen NE","Länsi W","Etelä S","Itä E","Pohjoinen N","Päiväntasaaja",
    "Kauriin kääntöpiiri","Kravun kääntöpiiri","Pohjoinen napapiiri","Leveyspiirit","Pituuspiirit",
    "Intian valtameri","Atlantin valtameri","Tyynimeri","Etelä-Amerikka","Pohjois-Amerikka","Australia",
    "Eurooppa","Aasia","Afrikka","Etelämanner","Lähi-itä"
  ];
  const kaikkiKasvit = nimet.map(nimi => ({ nimi, kuva: `Kuvat/${encodeURIComponent(nimi)}.png` }));
  const yhdyssanaMappi = {
    "Väli-Amerikka": "Väli-<br>Amerikka",
    "Keski-Amerikka": "Keski-<br>Amerikka",
    "Anglo-Amerikka": "Anglo-<br>Amerikka",
    "Päiväntasaaja": "Päivän-<br>tasaaja",
    "Leveyspiirit": "Leveys-<br>piirit",
    "Pituuspiirit": "Pituus-<br>piirit",
    "Tyynimeri": "Tyyni-<br>meri",
    "Etelä-Amerikka": "Etelä-<br>Amerikka",
    "Pohjois-Amerikka": "Pohjois-<br>Amerikka",
    "Etelämanner": "Etelä-<br>manner",
    "Lähi-itä": "Lähi-<br>itä"
  };

  let pisteet = 0;
  let aikaaJäljellä = 30;
  let kokonaisAika = 0;
  let ajastin = null;
  let delayTimer = null;
  let peliKaynnissa = false;
  let nykyinenOikea = null;
  let edellinenOikea = null;
  let vaaratKerrat = 0;

  const napit = [...document.querySelectorAll('.name-btn')];
  const imgElement = document.getElementById('plant-image');

  function muotoileNimi(nimi) {
    if (window.innerWidth <= 768) {
      if (yhdyssanaMappi[nimi]) return yhdyssanaMappi[nimi];
      if (nimi.includes(' ')) return nimi.replace(' ', '<br>');
    }
    return nimi;
  }

  function laskePainikkeenLeveys() {
    if (window.innerWidth <= 768) return;

    const dummy = document.createElement('span');
    dummy.style.position = 'absolute';
    dummy.style.visibility = 'hidden';
    dummy.style.whiteSpace = 'nowrap';
    dummy.style.fontSize = '15px';
    dummy.style.fontWeight = '700';
    dummy.style.fontFamily = "'din-round', system-ui, -apple-system, sans-serif";
    dummy.style.padding = '0 8px';
    document.body.appendChild(dummy);

    let maxLeveys = 0;
    kaikkiKasvit.forEach(kasvi => {
      dummy.textContent = kasvi.nimi;
      maxLeveys = Math.max(maxLeveys, dummy.getBoundingClientRect().width);
    });
    document.body.removeChild(dummy);

    document.documentElement.style.setProperty('--btn-width', `${maxLeveys + 24}px`);
  }

  function sekoita(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function aloitaPeli() {
    laskePainikkeenLeveys();
    document.body.classList.remove('flashing');
    pisteet = 0;
    aikaaJäljellä = 30;
    kokonaisAika = 0;
    peliKaynnissa = true;
    edellinenOikea = null;

    document.getElementById('points').textContent = pisteet;
    document.getElementById('time-left').textContent = aikaaJäljellä;
    document.getElementById('game-over').style.display = 'none';
    document.getElementById('game-board').style.display = 'flex';

    uusiKierros();

    clearInterval(ajastin);
    ajastin = setInterval(() => {
      aikaaJäljellä--;
      kokonaisAika++;
      document.getElementById('time-left').textContent = aikaaJäljellä;
      if (aikaaJäljellä <= 0) lopetaPeli();
    }, 1000);
  }

  function uusiKierros() {
    if (!peliKaynnissa) return;

    clearTimeout(delayTimer);
    vaaratKerrat = 0;

    const mahdollisetKasvit = kaikkiKasvit.filter(
      k => !edellinenOikea || k.nimi !== edellinenOikea.nimi
    );

    nykyinenOikea = mahdollisetKasvit[Math.floor(Math.random() * mahdollisetKasvit.length)];
    edellinenOikea = nykyinenOikea;

    const muutKasvit = kaikkiKasvit.filter(k => k.nimi !== nykyinenOikea.nimi);
    const sekoitetutMuut = sekoita(muutKasvit).slice(0, 5);
    const kaikkiKuusi = sekoita([nykyinenOikea, ...sekoitetutMuut]);

    imgElement.classList.remove('visible');

    napit.forEach(nappi => {
      nappi.classList.remove('visible', 'wrong-flash', 'correct-reveal');
      nappi.disabled = true;
    });

    imgElement.onload = () => {
      if (peliKaynnissa) {
        requestAnimationFrame(() => imgElement.classList.add('visible'));
      }
    };

    imgElement.onerror = () => {
      console.error('Kuvan lataus epäonnistui:', imgElement.src);
      imgElement.alt = `Kuvaa ei löytynyt: ${nykyinenOikea.nimi}`;
    };

    imgElement.src = nykyinenOikea.kuva;

    delayTimer = setTimeout(() => {
      if (!peliKaynnissa) return;

      napit.forEach((nappi, idx) => {
        const kasvi = kaikkiKuusi[idx];
        nappi.innerHTML = muotoileNimi(kasvi.nimi);
        nappi.dataset.nimi = kasvi.nimi;
        nappi.onclick = () => tarkistaValinta(nappi, kasvi.nimi);
        nappi.disabled = false;
        nappi.classList.add('visible');
      });
    }, 3000);
  }

  function tarkistaValinta(nappi, valittuNimi) {
    if (!peliKaynnissa || nappi.disabled) return;

    if (valittuNimi === nykyinenOikea.nimi) {
      pisteet += 2;
      aikaaJäljellä += 4;
      document.getElementById('points').textContent = pisteet;
      document.getElementById('time-left').textContent = aikaaJäljellä;
      uusiKierros();
      return;
    }

    pisteet -= 1;
    vaaratKerrat++;
    document.getElementById('points').textContent = pisteet;
    nappi.classList.add('wrong-flash');
    nappi.disabled = true;

    if (vaaratKerrat >= 2) {
      const kaikkiNapit = document.querySelectorAll('.name-btn');
      kaikkiNapit.forEach(b => {
        b.disabled = true;
        if (b.dataset.nimi === nykyinenOikea.nimi) {
          b.classList.add('correct-reveal');
        }
      });

      setTimeout(() => {
        if (peliKaynnissa) uusiKierros();
      }, 2000);
    }
  }

  function lopetaPeli() {
    peliKaynnissa = false;
    clearInterval(ajastin);
    clearTimeout(delayTimer);

    document.getElementById('game-board').style.display = 'none';

    const restartBtn = document.getElementById('restart-btn');
    restartBtn.disabled = true;
    setTimeout(() => {
      restartBtn.disabled = false;
    }, 2000);

    const storageKey = 'nimijahti_maailmankartan_perusasiat_pisteet';
    let historia = JSON.parse(localStorage.getItem(storageKey) || '[]');
    const aiempiEnnatys = historia.length > 0 ? Math.max(...historia.map(h => h.pisteet)) : -Infinity;
    const uusiEnnatys = pisteet > aiempiEnnatys && pisteet > 0;

    const uusiTulos = { id: Date.now(), pisteet: pisteet, aika: kokonaisAika };
    historia.push(uusiTulos);
    historia.sort((a, b) => b.pisteet - a.pisteet);
    historia = historia.slice(0, 20);

    localStorage.setItem(storageKey, JSON.stringify(historia));

    const msgElement = document.getElementById('result-message');
    if (uusiEnnatys) {
      msgElement.textContent = `Mahtavaa! Teit ennätyksesi ${pisteet} pistettä!`;
      document.body.classList.add('flashing');
      setTimeout(() => document.body.classList.remove('flashing'), 5000);
    } else {
      msgElement.textContent = `Peli päättyi: sait ${pisteet} pistettä!`;
    }

    const scoreList = document.getElementById('score-list');
    scoreList.innerHTML = '';

    historia.forEach((item, index) => {
      const li = document.createElement('li');
      li.innerHTML = `<span>#${index + 1}</span> <span>${item.pisteet} p (${item.aika}s)</span>`;
      if (item.id === uusiTulos.id) li.className = 'latest-score';
      scoreList.appendChild(li);
    });

    document.getElementById('game-over').style.display = 'flex';
  }

  window.addEventListener('resize', laskePainikkeenLeveys);
  window.addEventListener('contextmenu', e => e.preventDefault());

  aloitaPeli();
</script>
</body>
</html>
